name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: seed the demo book (public domain fixture)
        run: |
          mkdir -p apps/desktop/public/seed
          curl -sL -o apps/desktop/public/seed/frankenstein.epub \
            https://www.gutenberg.org/ebooks/84.epub.noimages

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
