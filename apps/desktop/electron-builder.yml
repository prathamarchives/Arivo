appId: com.prathamarchives.arivo
productName: Arivo
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - nsis
  artifactName: Arivo-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Arivo-${version}-setup.${ext}
electronDownload:
  cache: true

# the auto-update feed: emitting app-update.yml into the package (so
# installed builds know their feed) + latest.yml / .blockmap into release/
# (the feed itself). publishing stays manual — the release workflow owns
# release creation, checksums, and attachment (--publish never).
publish:
  provider: github
  owner: prathamarchives
  repo: Arivo

