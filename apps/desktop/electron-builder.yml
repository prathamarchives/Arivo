appId: com.prathamarchives.arivo
productName: Arivo
# v0.5.0 — the app icon: the catalyst glyph — a white circle with a
# couple of very small punched holes on a hairline ink ring. buildResources dir = apps/desktop/build/.
icon: build/icon.png
directories:
  output: release
files:
  - out/**
  - package.json
  # dev-only files never ship: the workspace packages ride node_modules
  # as raw ts (the type-stripping contract), but their tests and bench
  # harnesses are development weight, not product
  - '!**/node_modules/@arivo/**/*.test.ts'
  - '!**/node_modules/@arivo/**/bench/**'
  - '!**/node_modules/@arivo/**/*.test.js'
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: Arivo-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Arivo-${version}-setup.${ext}
electronDownload:
  cache: true

# the auto-update feed: emitting app-update.yml into the package (so
# installed builds know their feed) + latest.yml / .blockmap into release/
# (the feed itself). publishing stays manual — the release workflow owns
# release creation, checksums, and attachment (--publish never).
publish:
  provider: github
  owner: prathamarchives
  repo: Arivo

